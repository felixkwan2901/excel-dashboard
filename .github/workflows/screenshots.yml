name: Screenshot tests

# Every page, dark/light, laptop/phone — see tests/screenshots/README.md.
# Runs after a push to main (alongside the deploy, not blocking it) and on
# request. This repo pushes straight to main, so a changed look is nearly
# always deliberate: the run RECORDS the new Linux baselines and commits
# them (the diff is then visible in git), and only fails when a page cannot
# be rendered at all. The Mac run before pushing is the gate for slips.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'pending-updates/**'
      - 'public/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Render every page and record the Linux baselines
        run: npx playwright test --update-snapshots
      - name: Commit the baselines when the look changed
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/screenshots/__screenshots__
          git diff --cached --quiet || (git commit -m "Screenshot baselines (linux)" && git pull --rebase && git push)
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshot-report
          path: playwright-report
          retention-days: 14
