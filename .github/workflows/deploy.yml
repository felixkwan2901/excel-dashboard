name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# The upload worker can land two commits in quick succession (data file,
# then AI checks), each triggering its own run of this workflow. Without
# this, both runs build in parallel and race to push gh-pages, and the
# loser fails with a ref-lock conflict. Serialize so the second run always
# starts from a clean gh-pages state.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Record this deploy's commit as the build ID
        run: echo "$GITHUB_SHA" > public/build-id.txt

      - run: npm run build

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # Without this, every deploy wipes the previous build's content-hashed
          # JS/CSS files entirely. A browser with a stale cached index.html (or
          # an old service worker still serving the old shell) would then request
          # a filename that's simply gone — a 404 before React even mounts, which
          # shows as a blank page with no error to catch. Keeping old asset files
          # around means a stale index.html still resolves, buying time for the
          # update-check/reload path in main.jsx to catch up.
          keep_files: true

  # The Cloudflare copy (cd-dashboard.fkw24.workers.dev), which is the same
  # site behind a login. Deliberately a separate job, not extra steps on the
  # one above: if this fails, GitHub Pages has already published and
  # kwanfelix.me is unaffected.
  #
  # Inert until CLOUDFLARE_API_TOKEN exists in the repo secrets. Create one at
  # Cloudflare > Manage Account > API Tokens with the "Edit Cloudflare Workers"
  # template, then: gh secret set CLOUDFLARE_API_TOKEN
  cloudflare:
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Skip with a clear reason if the token is missing
        id: gate
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "No CLOUDFLARE_API_TOKEN secret set — skipping the Cloudflare deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Record this deploy's commit as the build ID
        if: steps.gate.outputs.ready == 'true'
        run: echo "$GITHUB_SHA" > public/build-id.txt

      # Served from the domain root and talking to its own origin, unlike the
      # GitHub Pages build above which keeps the /excel-dashboard/ base and the
      # public worker URL.
      - name: Build for the Cloudflare site
        if: steps.gate.outputs.ready == 'true'
        run: npm run build
        env:
          APP_BASE: /
          VITE_API_BASE: /api
          # A precaching service worker answers navigations from its cache, so
          # on this build it served the app shell to signed-out browsers and the
          # login page never rendered. Ships one that unregisters itself instead.
          # Leave this set: without it the next deploy puts the loop back.
          PWA_SELF_DESTROY: '1'
          # The sidebar link and, more importantly, the printed QR codes. Left
          # unset they point at the GitHub Pages copy of the field app, so a
          # code stuck on a switchboard door sends the crew to a different app
          # writing progress this dashboard is not reading.
          VITE_FIELD_APP_URL: https://cd-field.fkw24.workers.dev/

      - name: Deploy
        if: steps.gate.outputs.ready == 'true'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: dc836f801a754ca49cb4ea1290935614
