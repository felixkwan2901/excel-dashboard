name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# The upload worker can land two commits in quick succession (data file,
# then AI checks), each triggering its own run of this workflow. Without
# this, both runs build in parallel and race to push gh-pages, and the
# loser fails with a ref-lock conflict. Serialize so the second run always
# starts from a clean gh-pages state.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Record this deploy's commit as the build ID
        run: echo "$GITHUB_SHA" > public/build-id.txt

      - run: npm run build

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # Without this, every deploy wipes the previous build's content-hashed
          # JS/CSS files entirely. A browser with a stale cached index.html (or
          # an old service worker still serving the old shell) would then request
          # a filename that's simply gone — a 404 before React even mounts, which
          # shows as a blank page with no error to catch. Keeping old asset files
          # around means a stale index.html still resolves, buying time for the
          # update-check/reload path in main.jsx to catch up.
          keep_files: true
