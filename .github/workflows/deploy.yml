name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# The upload worker can land two commits in quick succession (data file,
# then AI checks), each triggering its own run of this workflow. Without
# this, both runs build in parallel and race to push gh-pages, and the
# loser fails with a ref-lock conflict. Serialize so the second run always
# starts from a clean gh-pages state.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
