name: Sync to WordPress Dashboard Page

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Update WordPress Page
        run: |
          PAGE_ID="2179"
          
          # Clean domain URL to remove trailing slashes
          BASE_URL=$(echo "${{ secrets.WP_URL }}" | sed 's/*$//')
          
          # Wrap index.html inside a Gutenberg HTML block and escape for JSON
          RAW_HTML=$(cat index.html)
          BLOCK_CONTENT="<!-- wp:html -->${RAW_HTML}<!-- /wp:html -->"
          JSON_PAYLOAD=$(jq -n --arg content "$BLOCK_CONTENT" '{content: $content}')

          curl -X POST "${BASE_URL}/wp-json/wp/v2/pages/${PAGE_ID}" \
            -u "${{ secrets.WP_USER }}:${{ secrets.WP_PASSWORD }}" \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD"
