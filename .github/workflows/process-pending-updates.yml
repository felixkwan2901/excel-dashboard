name: Process pending data updates

# The upload-worker (Cloudflare, free plan) stages requests here instead of
# processing them itself — Excel parsing/writing (via ExcelJS) easily
# exceeds the free plan's 10ms CPU-time limit for a workbook this size and
# was crashing intermittently. This workflow runs on a full GitHub-hosted
# runner (no such limit) and does the actual work.

on:
  push:
    branches: [main]
    paths:
      - 'pending-updates/**'
  workflow_dispatch:

permissions:
  contents: write

# If the worker stages two requests in quick succession, each push
# triggers its own run — serialize so the second always starts from the
# first's committed result rather than both reading a stale workbook.
concurrency:
  group: process-pending-updates
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Merge staged job exports
        run: node scripts/update-jobs.mjs pending-updates/exports

      - name: Apply staged workbook replacements
        run: node scripts/apply-replace.mjs

      - name: Apply staged checklist edits
        run: node scripts/apply-main-sheet-edits.mjs

      - name: Snapshot this month's cumulative hours per job
        run: node scripts/log-monthly-hours.mjs

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Process pending data updates ($(date -u +%Y-%m-%dT%H:%M:%SZ))"

          # main can move between our checkout and this push (e.g. the
          # upload-worker staging another export directly), so rebase onto
          # the latest main and retry instead of failing on a bare
          # non-fast-forward rejection.
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected, rebasing onto latest main (attempt $i)..."
            git fetch origin main
            git rebase origin/main
          done

          echo "::error::Failed to push after multiple retries"
          exit 1
