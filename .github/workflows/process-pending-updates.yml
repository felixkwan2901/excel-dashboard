name: Process pending data updates

# The upload-worker (Cloudflare, free plan) stages requests here instead of
# processing them itself — Excel parsing/writing (via ExcelJS) easily
# exceeds the free plan's 10ms CPU-time limit for a workbook this size and
# was crashing intermittently. This workflow runs on a full GitHub-hosted
# runner (no such limit) and does the actual work.

on:
  push:
    branches: [main]
    paths:
      - 'pending-updates/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# If the worker stages two requests in quick succession, each push
# triggers its own run — serialize so the second always starts from the
# first's committed result rather than both reading a stale workbook.
concurrency:
  group: process-pending-updates
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Process pending updates and push (retries on conflict)
        id: process
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # A big batch of uploads (e.g. 30 files) stages one commit per
          # file, so several runs of this workflow can end up racing each
          # other. The old approach committed once, then REBASED that
          # commit onto main if the push was rejected — replaying a stale
          # diff (which renames/archives files) onto a tree another run had
          # ALSO just renamed/archived produces a structural git conflict
          # ("file added inside a directory that was renamed") that isn't
          # auto-resolvable, and the whole run just failed.
          #
          # Instead of replaying an old diff, redo the work from scratch
          # each retry: reset to the latest main and RE-RUN the merge
          # scripts against it. There's nothing to conflict with, because
          # there's no stale diff being replayed — every attempt processes
          # whatever is genuinely still pending right now. Re-running is
          # safe/idempotent: update-jobs.mjs's own duplicate detection skips
          # anything an earlier run already merged, and it takes well under
          # a second regardless.
          # A large batch (e.g. ~40 files dropped at once) stages that many
          # individual commits in quick succession, each landing on main
          # independently of this workflow's own concurrency group (that
          # group only serializes RUNS of this workflow against each other
          # — it does nothing to slow down the worker's own per-file
          # staging pushes racing against this loop's push). 5 attempts
          # with no delay between them wasn't enough headroom for that: a
          # run could lose the race 5 times in a row purely because another
          # staging commit kept landing in the same few hundred ms window,
          # and every attempt from then on just reprocesses nothing new.
          # 20 attempts with a short randomized backoff gives collisions
          # room to space out without meaningfully slowing the common case
          # (which still succeeds on attempt 1 the vast majority of the time).
          for i in $(seq 1 20); do
            node scripts/add-new-job.mjs
            node scripts/update-jobs.mjs pending-updates/exports
            node scripts/apply-replace.mjs
            node scripts/apply-main-sheet-edits.mjs
            node scripts/apply-claim-calculator-edits.mjs
            node scripts/apply-upcoming-work-edits.mjs
            node scripts/apply-archived-jobs-edits.mjs
            node scripts/log-monthly-hours.mjs

            git add -A
            if git diff --cached --quiet; then
              echo "Nothing to commit."
              echo "pushed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m "Process pending data updates ($(date -u +%Y-%m-%dT%H:%M:%SZ))"

            if git push; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            sleep_seconds=$(( (RANDOM % 4) + 1 ))
            echo "Push rejected — resetting to latest main and reprocessing fresh in ${sleep_seconds}s (attempt $i)..."
            sleep "$sleep_seconds"
            git fetch origin main
            git reset --hard origin/main
          done

          echo "::error::Failed to push after multiple retries"
          exit 1

      # A push made with the default GITHUB_TOKEN (as the commit above is)
      # deliberately does NOT cascade into triggering other workflows —
      # GitHub's built-in loop guard — so deploy.yml's own `on: push`
      # trigger never fires for this commit. Without this step, the actual
      # merged data only ever reaches the live site when some UNRELATED
      # human push happens to land on main around the same time and
      # incidentally triggers a rebuild; on a quiet day, the site can sit
      # showing stale data indefinitely despite main having the real
      # numbers. Dispatching it explicitly closes that gap.
      - name: Trigger a site rebuild
        if: steps.process.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
